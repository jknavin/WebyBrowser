name: Build Weby Browser (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch extra ad/tracker lists (optional)
        run: npm run blocklist
        continue-on-error: true

      - name: Build installer + portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Weby-Browser-Installer
          path: dist/Weby-Browser-Setup-*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Weby-Browser-Portable
          path: dist/Weby-Browser-Portable-*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Weby-Browser-Setup-*.exe
            dist/Weby-Browser-Portable-*.exe
