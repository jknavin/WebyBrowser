<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Print</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; frame-src weby:; img-src data:">
<link rel="stylesheet" href="print.css">
</head>
<body>
<aside class="panel">
  <header>
    <h1>Print</h1>
    <p id="doc-title" class="muted">Loading…</p>
  </header>

  <div class="scroll">
    <section>
      <h2>Layout</h2>
      <div class="seg" id="layout">
        <button data-v="original">Original</button>
        <button data-v="clean" class="on">Clean</button>
        <button data-v="reader">Reader</button>
      </div>
      <p class="hint" id="layout-hint">Clean removes menus, sidebars, popups and ads, and keeps the main content.</p>
    </section>

    <section>
      <h2>Destination</h2>
      <label>Printer
        <select id="printer"><option value="">Default printer</option></select>
      </label>
      <label class="check"><input type="checkbox" id="systemDialog"> Use the Windows print dialog</label>
    </section>

    <section>
      <h2>Paper</h2>
      <div class="row">
        <label>Size <select id="paper"></select></label>
        <label>Orientation
          <select id="landscape"><option value="0">Portrait</option><option value="1">Landscape</option></select>
        </label>
      </div>
      <div class="row">
        <label>Margins
          <select id="margins"><option value="default">Default</option><option value="minimum">Minimum</option><option value="none">None</option></select>
        </label>
        <label>Scale %
          <input type="number" id="scale" min="10" max="200" value="100">
        </label>
      </div>
      <div class="row">
        <label>Pages <input type="text" id="pageRanges" placeholder="All  (e.g. 1-3, 5)"></label>
        <label>Copies <input type="number" id="copies" min="1" max="99" value="1"></label>
      </div>
      <label>Two-sided
        <select id="duplex"><option value="simplex">Off</option><option value="longEdge">Long edge</option><option value="shortEdge">Short edge</option></select>
      </label>
    </section>

    <section>
      <h2>Save ink &amp; paper</h2>
      <label class="check"><input type="checkbox" id="inkSaver"> Ink saver (black text, no backgrounds)</label>
      <label class="check"><input type="checkbox" id="noImages"> Remove images</label>
      <label class="check"><input type="checkbox" id="color" checked> Colour</label>
      <label class="check"><input type="checkbox" id="background"> Background graphics</label>
      <label class="check"><input type="checkbox" id="showLinks"> Show link addresses</label>
      <label class="check"><input type="checkbox" id="headerFooter" checked> Header &amp; footer (title, date, URL, page no.)</label>
    </section>
  </div>

  <footer>
    <div class="status" id="status"></div>
    <div class="actions">
      <button id="btn-print" class="primary">Print</button>
      <button id="btn-save">Save as PDF</button>
      <button id="btn-cancel" class="ghost">Cancel</button>
    </div>
  </footer>
</aside>

<main class="stage">
  <div class="pagebar"><span id="pages">—</span></div>
  <div class="viewer">
    <div id="busy" class="busy">Preparing preview…</div>
    <iframe id="pdf" title="Print preview"></iframe>
  </div>
</main>
<script src="print-ui.js"></script>
</body>
</html>
